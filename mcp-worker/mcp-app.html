<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FPL League Shop</title>
    <script type="module" src="/src/app.ts"></script>
  </head>
  <body>
    <main class="app-shell">
      <header class="toolbar">
        <div>
          <p class="eyebrow">FPL LEAGUE SHOP</p>
          <h1 id="league-name">League standings</h1>
          <p id="league-meta" class="muted">Enter a Juicebox project to load its league.</p>
        </div>
        <button id="reload" class="icon-button" type="button" aria-label="Refresh standings" title="Refresh standings">↻</button>
      </header>
      <section class="controls" aria-label="Shop setup">
        <label>Juicebox project route<input id="project-route" placeholder="base:9" /></label>
      </section>
      <p id="status" class="status" role="status">Waiting for a league.</p>
      <section class="table-wrap" aria-label="Manager standings">
        <table>
          <thead><tr><th>Rank</th><th>Manager</th><th>Team</th><th class="points">Points</th><th aria-label="Checkout"></th></tr></thead>
          <tbody id="standings"></tbody>
        </table>
      </section>
      <section id="purchase" class="purchase" hidden>
        <div>
          <p class="eyebrow">PAYBOX CHECKOUT PREPARED</p>
          <p id="selected-manager"></p>
          <code id="memo"></code>
          <p id="purchase-detail" class="muted">Select live NFT tier IDs and use the PayBox wallet in chat to create the unsigned transaction plan.</p>
        </div>
      </section>
    </main>
  </body>
</html>
