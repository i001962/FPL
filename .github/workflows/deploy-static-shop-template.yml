name: Deploy Static Shop Template

on:
  push:
    branches: [main]
    paths:
      - 'static-shop-template/**'
      - 'scripts/upload-static-shop-template-qstorage.sh'
      - '.github/workflows/deploy-static-shop-template.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-static-shop-template
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      QSTORAGE_ENDPOINT: https://qstorage.quilibrium.com
      QSTORAGE_BUCKET: footy
      QSTORAGE_REGION: us-east-1
      QSTORAGE_PREFIX: static-shop-template
      QSTORAGE_ACCESS_KEY_ID: ${{ secrets.QSTORAGE_ACCESS_KEY_ID }}
      QSTORAGE_SECRET_ACCESS_KEY: ${{ secrets.QSTORAGE_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure path-style S3 requests
        run: |
          mkdir -p "$RUNNER_TEMP/aws-config"
          cat > "$RUNNER_TEMP/aws-config/config" <<'EOF'
          [default]
          s3 =
              addressing_style = path
          EOF
          echo "AWS_CONFIG_FILE=$RUNNER_TEMP/aws-config/config" >> "$GITHUB_ENV"

      - name: Validate QStorage credentials are configured
        run: |
          test -n "$QSTORAGE_ACCESS_KEY_ID"
          test -n "$QSTORAGE_SECRET_ACCESS_KEY"

      - name: Sync static template and verify public page
        run: scripts/upload-static-shop-template-qstorage.sh
