name: Deploy FPL Intelligence MCP Worker

on:
  push:
    branches:
      - main
    paths:
      - "fpl-intelligence-worker/**"
      - ".github/workflows/deploy-fpl-intelligence-mcp.yml"
  workflow_dispatch:

concurrency:
  group: deploy-fpl-intelligence-mcp
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: fpl-intelligence-worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: fpl-intelligence-worker/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run check

      - name: Deploy
        run: npm run deploy
